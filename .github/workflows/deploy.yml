name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.3.0, v1.0.0, etc.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Check production data and workload models
        run: |
          cargo test --locked --test data_tests --test models_tests
          cargo test --locked --test exact_tests hauling
          cargo test --locked --test exact_tests electricity

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install Binaryen
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends binaryen

      - name: Build WASM
        run: wasm-pack build --target web --out-dir web/pkg

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
